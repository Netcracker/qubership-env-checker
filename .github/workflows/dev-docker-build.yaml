---

# Workflow to build and publish multiple docker images based on configuration file (.qubership/docker.cfg)
# Configuration file example: config/examples/docker.cfg
# Full description of configuration file can be found in docs https://github.com/Netcracker/qubership-workflow-hub/tree/main/actions/docker-config-resolver

name: "CI: Dev Docker Build"
run-name: "Ref: ${{ github.ref_name }}. On ${{ github.event_name }}"

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Tags'
        required: false
        type: string
        default: ''
      dry-run:
        description: 'Dry run'
        required: false
        type: boolean
        default: false
      replace-symbol:
        required: false
        type: string
        default: "_"
        description: "Symbol to replace in tags"
  push:
    branches:
    - '**'
    paths-ignore:
    - '**'
    - '!.github/**'
    - '.github/workflows/dev-docker-build.yaml'
    - '!docs/**'
    # Repo uses paths-ignore + negations: without these, everything matches '**' and pushes never trigger a build.
    - '!Dockerfile'
    - '!.qubership/docker.cfg'
    - '!installation/**'
    - '!jovyan/**'
    - 'CODE-OF-CONDUCT.md'
    - 'CONTRIBUTING.md'
    - 'LICENSE'
    - 'README.md'
    - 'SECURITY.md'

permissions:
  contents: read

env:
  CONFIG_FILE: '.qubership/docker.cfg'

jobs:
  load-config:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      packages: ${{ steps.config.outputs.config }}
      # Bot branches must build without publishing; merged code on the default branch follows normal publication.
      force-dry-run: ${{ contains(fromJSON(steps.policy.outputs.config)['no-publish-actors'].*.id, format('{0}', github.actor_id)) && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Get Configuration File
        uses: netcracker/qubership-workflow-hub/actions/docker-config-resolver@8c6dbeb901920bae9f40d7d7b646d8d9127e1ce7 # v2.4.0
        id: config
        with:
          file-path: "${{ env.CONFIG_FILE }}"

      - name: Resolve workflow policy
        id: policy
        uses: netcracker/qubership-workflow-hub/actions/config-resolver@86c8965947f83325e558d72c5d9e0a5cde99ee21 # PR #866 (unreleased)
        with:
          file-path: .qubership/workflow-policy.json
          schema: workflow-policy/v1

      - name: Validate workflow policy
        env:
          CONFIG_JSON: ${{ steps.policy.outputs.config }}
        run: |
          jq -e '
            def valid_actors:
              type == "array"
              and length > 0
              and all(.[];
                type == "object"
                and (keys == ["id", "login"])
                and (.id | type == "string" and test("^[0-9]+$"))
                and (.login | type == "string" and length > 0))
              and (map(.id) | length == (unique | length))
              and (map(.login) | length == (unique | length));
            type == "object"
            and .schema == "workflow-policy/v1"
            and (."no-publish-actors" | valid_actors)
            and (."skip-pr-automation-actors" | valid_actors)
            and ((keys - ["schema", "no-publish-actors", "skip-pr-automation-actors"]) | length == 0)
          ' <<< "$CONFIG_JSON" > /dev/null

  docker-build:
    name: "Build and Publish Docker Image"
    needs: load-config
    permissions:
      packages: write
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        component: ${{ fromJson(needs.load-config.outputs.packages) }}
    steps:
      - name: "Checkout code"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: "Create name"
        uses: netcracker/qubership-workflow-hub/actions/metadata-action@8c6dbeb901920bae9f40d7d7b646d8d9127e1ce7 # v2.4.0
        id: metadata
        with:
          default-template: "{{ref-name}},git-{{short-sha}}"
          extra-tags: ${{ github.event.inputs.tags || '' }}
          replace-symbol: ${{ github.event.inputs.replace-symbol || '_'}}

      - name: "Prepare tags"
        id: prepare_tags
        run: |
          BASE_TAG="${{ steps.metadata.outputs.result }}"
          EXTRA_TAG="${{ github.event.inputs.tags }}"
          TAGS="${BASE_TAG}"
          if [ -n "$EXTRA_TAG" ]; then
            TAGS="${TAGS},${EXTRA_TAG}"
          fi
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAGS="${TAGS},latest"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: "Summary step"
        run: |
          echo "**Metadata:** ${{ steps.metadata.outputs.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** ${{ steps.prepare_tags.outputs.tags }}" >> $GITHUB_STEP_SUMMARY

      - name: "Build and Publish Docker Image"
        uses: netcracker/qubership-workflow-hub/actions/docker-action@8c6dbeb901920bae9f40d7d7b646d8d9127e1ce7 # v2.4.0
        with:
          component: ${{ toJson(matrix.component) }}
          platforms: ${{ matrix.component.platforms }}
          checkout: "false"
          tags: ${{ steps.prepare_tags.outputs.tags }}
          dry-run: ${{ inputs.dry-run || needs.load-config.outputs.force-dry-run == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
