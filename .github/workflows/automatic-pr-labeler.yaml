---

# The workflow template for automatic PR labeler.
# It requires to have a configuration file with labels and conditions to apply them.
# The configuration file should be placed in the .github folder and named auto-labeler-config.yaml.
# Example file can be found there:
# https://github.com/Netcracker/.github/blob/main/config/examples/auto-labeler-config.yaml

name: Automatic PR Labeler
run-name: PR #${{ github.event.pull_request.number }} - Automatic Labeler
on:
  pull_request:
    branches: [main]
    types:
      [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  assign-labels:
    name: "Assign Labels to PR #${{ github.event.pull_request.number }}"
    if: github.event.pull_request.merged == false
    permissions:
      pull-requests: write
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve workflow policy
        id: policy
        uses: netcracker/qubership-workflow-hub/actions/config-resolver@86c8965947f83325e558d72c5d9e0a5cde99ee21 # PR #866 (unreleased)
        with:
          file-path: .qubership/workflow-policy.json
          schema: workflow-policy/v1

      - name: Validate workflow policy
        env:
          CONFIG_JSON: ${{ steps.policy.outputs.config }}
        run: |
          jq -e '
            def valid_actors:
              type == "array"
              and length > 0
              and all(.[];
                type == "object"
                and (keys == ["id", "login"])
                and (.id | type == "string" and test("^[0-9]+$"))
                and (.login | type == "string" and length > 0))
              and (map(.id) | length == (unique | length))
              and (map(.login) | length == (unique | length));
            type == "object"
            and .schema == "workflow-policy/v1"
            and (."no-publish-actors" | valid_actors)
            and (."skip-pr-automation-actors" | valid_actors)
            and ((keys - ["schema", "no-publish-actors", "skip-pr-automation-actors"]) | length == 0)
          ' <<< "$CONFIG_JSON" > /dev/null

      - name: "Execute assign labels"
        id: action-assign-labels
        if: ${{ !contains(fromJSON(steps.policy.outputs.config)['skip-pr-automation-actors'].*.id, format('{0}', github.event.pull_request.user.id)) }}
        uses: mauroalderete/action-assign-labels@671a4ca2da0f900464c58b8b5540a1e07133e915 # v1.5.1
        with:
          pull-request-number: ${{ github.event.pull_request.number }}
          github-token: ${{ github.token }}
          conventional-commits: "./.github/auto-labeler-config.yaml"
          maintain-labels-not-matched: true
          apply-changes: ${{ github.event.pull_request.base.repo.id == github.event.pull_request.head.repo.id }}

      - name: "Set labels-next safely for PR from fork"
        if: ${{ github.event.pull_request.base.repo.id != github.event.pull_request.head.repo.id }}
        run: |
          echo "LABELS_NEXT=$(echo ${STEPS_ACTION_ASSIGN_LABELS_OUTPUTS_LABELS_NEXT} | tr -dc 'a-zA-Z0-9-,')" >> $GITHUB_ENV
        env:
          STEPS_ACTION_ASSIGN_LABELS_OUTPUTS_LABELS_NEXT: ${{ steps.action-assign-labels.outputs.labels-next }}
      - name: "Drop warning if PR from fork"
        if: ${{ github.event.pull_request.base.repo.id != github.event.pull_request.head.repo.id }}
        run: |
          {
            echo "⚠️ Pull request from fork! ⚠️";
            echo "Labels will not be applied to PR. Assign them manually please.";
            echo "Labels to assign: '${LABELS_NEXT}'";
          } >> "$GITHUB_STEP_SUMMARY"
