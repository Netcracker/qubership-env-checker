---

# This workflow validates or publishes a versioned Docker image, Helm chart, and GitHub release.
# Dry-run mode uses read-only permissions, builds the image, and uploads a packaged chart without publishing a release.
# Release configuration: .qubership/helm-charts-release-config.yaml and .qubership/docker.cfg.

name: "Helm Charts Release"
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release version without "v" prefix'
        required: true
        type: string
      dry-run:
        description: 'Validate and package the release without publishing or changing the repository'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
run-name: ${{ github.repository }} Release ${{ github.event.inputs.release }}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHART_CONFIG_FILE: '.qubership/helm-charts-release-config.yaml'
  DOCKER_CONFIG_FILE: '.qubership/docker.cfg'
jobs:
  check-tag:
    name: "Check if tag exists"
    runs-on: ubuntu-latest
    steps:
      - name: "Check if tag exists"
        id: check_tag
        uses: netcracker/qubership-workflow-hub/actions/tag-action@8c6dbeb901920bae9f40d7d7b646d8d9127e1ce7 # v2.4.0
        with:
          tag-name: '${{ inputs.release }}'
          ref: ${{ github.ref }}
          create-tag: false
          check-tag: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  load-docker-build-components:
    name: "Load Docker Build Components Configuration"
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      packages: ${{ steps.config.outputs.config }}
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get Configuration File
        uses: netcracker/qubership-workflow-hub/actions/docker-config-resolver@8c6dbeb901920bae9f40d7d7b646d8d9127e1ce7 # v2.4.0
        id: config
        with:
          file-path: "${{ env.DOCKER_CONFIG_FILE }}"

  docker-check-build:
    name: "Docker Dry Run Build"
    needs: [load-docker-build-components, check-tag]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        component: ${{ fromJson(needs.load-docker-build-components.outputs.packages) }}
    steps:
      - name: "Get version for current component"
        id: get-version
        run: |
          echo "IMAGE=${{ matrix.component.name }}" >> $GITHUB_ENV
      - name: "Docker dry run build"
        uses: netcracker/qubership-workflow-hub/actions/docker-action@8c6dbeb901920bae9f40d7d7b646d8d9127e1ce7 # v2.4.0
        with:
          ref: ${{ github.ref }}
          download-artifact: false
          dry-run: true
          component: ${{ toJson(matrix.component) }}
          platforms: ${{ matrix.component.platforms }}
          tags: "dry-run-${{ inputs.release }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  chart-dry-run:
    name: "Helm Chart Dry Run"
    if: ${{ inputs.dry-run }}
    permissions:
      contents: read
      packages: read
    needs: [check-tag, load-docker-build-components, docker-check-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Add github.vars into github.env"
        env:
          VARS_JSON: '${{ toJson(vars) }}'
        run: |
          echo "${VARS_JSON}" | jq -r 'to_entries|map("\(.key)=\(.value)")|.[]' >> $GITHUB_ENV

      - name: "Prepare Helm chart"
        uses: netcracker/qubership-workflow-hub/actions/charts-values-update-action@8c6dbeb901920bae9f40d7d7b646d8d9127e1ce7 # v2.4.0
        with:
          release-version: ${{ inputs.release }}
          config-file: ${{ env.CHART_CONFIG_FILE }}
          default-tag: ${{ inputs.release }}
          create-release-branch: false
          package-charts: true
          publish-charts: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: "Show prepared release changes"
        run: git diff --check && git diff -- charts

  chart-release:
    name: "Helm Charts Release"
    if: ${{ !inputs.dry-run }}
    permissions:
      contents: write
      packages: write
    needs: [check-tag, load-docker-build-components, docker-check-build]
    runs-on: ubuntu-latest
    outputs:
      images-versions: ${{ steps.update-versions.outputs.images-versions }}
      # Keep the legacy output spelling used by charts-values-update-action@v2.4.0.
      charts-artifact: ${{ steps.update-versions.outputs.released-chart-atrifact }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: "Add github.vars into github.env"
        env:
          VARS_JSON: '${{ toJson(vars) }}'
        run: |
          echo "${VARS_JSON}" | jq -r 'to_entries|map("\(.key)=\(.value)")|.[]' >> $GITHUB_ENV

      - name: "Chart release"
        id: update-versions
        uses: netcracker/qubership-workflow-hub/actions/charts-values-update-action@8c6dbeb901920bae9f40d7d7b646d8d9127e1ce7 # v2.4.0
        with:
          release-version: ${{ inputs.release }}
          config-file: ${{ env.CHART_CONFIG_FILE }}
          default-tag: ${{ inputs.release }}
          create-release-branch: true
          package-charts: true
          publish-charts: true

      - name: "Debug"
        env:
          IMAGES_VERSIONS: "${{ steps.update-versions.outputs.images-versions }}"
        run: |
          echo "Images versions: ${IMAGES_VERSIONS}"
          ls -laR

  docker-build:
    name: "Docker Build and Publish"
    if: ${{ !inputs.dry-run }}
    needs: [chart-release, load-docker-build-components]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        component: ${{ fromJson(needs.load-docker-build-components.outputs.packages) }}
    steps:
      - name: "Get version for current component"
        id: get-version
        run: |
          echo "IMAGE_VERSION=${{ fromJson(needs.chart-release.outputs.images-versions)[matrix.component.name] || inputs.release }}" >> $GITHUB_ENV

      - name: "Generate tags list"
        id: generate-tags
        uses: netcracker/qubership-workflow-hub/actions/metadata-action@8c6dbeb901920bae9f40d7d7b646d8d9127e1ce7 # v2.4.0
        with:
          ref: ${{ inputs.release }}
          default-template: "{{major}}.{{minor}}.{{patch}},{{major}}.{{minor}},{{major}}"
          extra-tags: ''
          replace-symbol: '_'

      - name: "Docker build and publish"
        uses: netcracker/qubership-workflow-hub/actions/docker-action@8c6dbeb901920bae9f40d7d7b646d8d9127e1ce7 # v2.4.0
        with:
          ref: release-${{ inputs.release }}
          download-artifact: false
          dry-run: false
          component: ${{ toJson(matrix.component) }}
          platforms: ${{ matrix.component.platforms }}
          tags: "${{ steps.generate-tags.outputs.result }},latest"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  github-release:
    if: ${{ !inputs.dry-run }}
    permissions:
      contents: write
      packages: write
    needs: [chart-release, docker-build]
    continue-on-error: false
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: release-${{ inputs.release }}
          persist-credentials: true

      - name: "Release-drafter"
        uses: netcracker/release-drafter@130c08399304912ffe90e9604e4328f2fdcd7619  # v1.0.1
        with:
          config-name: release-drafter-config.yml
          publish: true
          name: v${{ inputs.release }}
          tag: v${{ inputs.release }}
          version: ${{ inputs.release }}
          commitish: release-${{ inputs.release }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Download released charts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ needs.chart-release.outputs.charts-artifact }}
      - name: "Upload Assets"
        uses: netcracker/qubership-workflow-hub/actions/assets-action@8c6dbeb901920bae9f40d7d7b646d8d9127e1ce7 # v2.4.0
        with:
          tag: ${{ inputs.release }}
          item-path: "./*.tgz"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
