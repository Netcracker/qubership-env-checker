---
name: Env Checker CI
run-name: "Ref: ${{ github.ref_name }}. On ${{ github.event_name }}"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions: {}

concurrency:
  group: env-checker-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      container: ${{ steps.filter.outputs.container }}
      chart: ${{ steps.filter.outputs.chart }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --no-renames --name-only "${BASE_SHA}...${HEAD_SHA}")"
          echo "Changed files:"
          printf '%s\n' "${changed}"

          container=false
          chart=false
          while IFS= read -r file; do
            case "${file}" in
              Dockerfile|.qubership/docker.cfg|installation/*|jovyan/*|.github/workflows/env-checker-ci.yaml)
                container=true
                ;;
              charts/*|.kubeconform.yaml|.github/workflows/env-checker-ci.yaml)
                chart=true
                ;;
            esac
          done <<< "${changed}"

          echo "container=${container}" >> "${GITHUB_OUTPUT}"
          echo "chart=${chart}" >> "${GITHUB_OUTPUT}"

  runtime_tests:
    name: Build image and run unit tests
    needs: changes
    if: needs.changes.outputs.container != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build CI image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          load: true
          no-cache: true
          platforms: linux/amd64
          provenance: false
          push: false
          tags: qubership-env-checker:ci
      - name: Run deterministic unit tests in the image
        run: |
          set -euo pipefail
          docker run --rm --user 1000:100 qubership-env-checker:ci \
            python -m unittest discover -s /home/jovyan/tests/unittests/reports -p '*_test.py' -v
          docker run --rm --user 1000:100 qubership-env-checker:ci \
            python -m unittest discover -s /home/jovyan/tests/unittests/shells -p '*_test.py' -v

  helm_lint:
    name: Lint Helm chart
    needs: changes
    if: needs.changes.outputs.chart != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.22.0
      - name: Lint and render the chart
        run: |
          set -euo pipefail
          helm lint charts/env-checker
          helm template env-checker charts/env-checker >/tmp/env-checker-rendered.yaml
          test -s /tmp/env-checker-rendered.yaml

  ci_gate:
    name: Env Checker CI Gate
    needs: [changes, runtime_tests, helm_lint]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require validation when applicable
        if: >-
          needs.changes.result != 'success' ||
          (needs.changes.outputs.container != 'false' && needs.runtime_tests.result != 'success') ||
          (needs.changes.outputs.chart != 'false' && needs.helm_lint.result != 'success')
        run: exit 1
